[package]
name = "rust-xterm-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "rust_xterm_renderer"
path = "src/lib.rs"

[dependencies]
rust-xterm-core = { path = "../rust-xterm-core" }
# swash / lru 用 caret（允许 0.1.x / 0.12.x patch 升级），而非 workspace 的 `=` 精确锁定。
# 原因：独立 GUI demo（iced-demo 经 cosmic-text）需 swash ^0.1.17 / lru ^0.12.1，
# 若此处用 `=0.1.15` 会与 iced 传递依赖冲突。
# workspace 自身构建仍锁定 0.1.15 / 0.12.0（/workspace/Cargo.lock sticky），不受影响。
swash = "0.1.15"
fontdb.workspace = true
lru = "0.12"
log.workspace = true
anyhow.workspace = true
