# =============================================================================
# slint-demo: 独立的 Slint GUI demo，集成 rust-xterm 终端库
# =============================================================================
# 依赖隔离硬约束：
#   - 不加入 /workspace/Cargo.toml 的 members
#   - 独立 Cargo.lock
#   - GUI 依赖 slint 只写在此处，不用 .workspace = true
#   - 引用 rust-xterm 库 crate 用相对 path
# =============================================================================

[package]
name = "slint-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[build-dependencies]
slint-build = "=1.6.0"

[dependencies]
# slint 必须用 `=` 精确锁定 1.6.0，否则 caret 会拉最新 1.x（如 1.17.1 要求 rustc 1.92）。
slint = "=1.6.0"
sysinfo = "0.30"
arboard = "3"
rust-xterm-core = { path = "../../crates/rust-xterm-core" }
rust-xterm-renderer = { path = "../../crates/rust-xterm-renderer" }
rust-xterm-host = { path = "../../crates/rust-xterm-host" }

# 开发时使用软件渲染后端，避免在无 GPU 环境下链接 OpenGL/EGL
# （默认 features 已包含 backend-winit + renderer-femtovg；在 headless CI 中编译即可）

# -----------------------------------------------------------------------------
# 独立工作区声明：使本 crate 成为自身的工作区根，
# 从而与 /workspace 的 workspace 完全解耦，拥有独立 Cargo.lock。
# -----------------------------------------------------------------------------
[workspace]
