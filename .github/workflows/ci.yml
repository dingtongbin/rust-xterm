name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Build & Test (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify rust-version lock
        run: |
          grep -q 'rust-version = "1.88"' Cargo.toml
          grep -q 'rust-version.workspace = true' crates/rust-xterm-core/Cargo.toml
          grep -q 'rust-version.workspace = true' crates/rust-xterm-renderer/Cargo.toml
          grep -q 'rust-version.workspace = true' crates/rust-xterm-host/Cargo.toml
      - name: Verify forbid(unsafe_code)
        run: |
          grep -q '#!\[forbid(unsafe_code)\]' crates/rust-xterm-core/src/lib.rs
          grep -q '#!\[forbid(unsafe_code)\]' crates/rust-xterm-renderer/src/lib.rs
          grep -q '#!\[forbid(unsafe_code)\]' crates/rust-xterm-host/src/lib.rs
          ! grep -rn 'unsafe ' crates/*/src/ | grep -v '//'
      - name: Build all targets
        run: cargo build --all-targets
      - name: Clippy all targets
        run: cargo clippy --all-targets -- -D warnings
      - name: Test all targets
        run: cargo test --all-targets
